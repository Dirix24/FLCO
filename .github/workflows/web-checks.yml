name: FLCO web checks
on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/web-checks.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-checks.yml'
jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.js
      - run: node --check web/lab.js
      - run: node --check web/explore.js
