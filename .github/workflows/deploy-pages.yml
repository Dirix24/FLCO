name: Publicar FLCO web en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener archivos
        uses: actions/checkout@v4
      - name: Comprobar scripts
        run: |
          node --check web/app.js
          node --check web/dial.js
          node --check web/offline.js
          node --check web/sw.js
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir solo la web, no README
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
