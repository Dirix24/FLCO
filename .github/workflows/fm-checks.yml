name: FLCO FM checks
on:
  push:
    branches: [feat/flco-radio-offline-presets]
  pull_request:
    paths:
      - "fm_server.py"
      - "web/**"
      - "tests/test_fm_server.py"
      - "android-fm-scan/**"
      - ".github/workflows/fm-checks.yml"
jobs:
  python-and-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m unittest discover -s tests -p 'test_fm_server.py' -v
      - run: python -m py_compile fm_server.py
      - run: |
          for file in web/*.js; do node --check "$file"; done
  android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: gradle -p android-fm-scan :app:assembleDebug --no-daemon
